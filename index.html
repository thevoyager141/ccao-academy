<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAO-F Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Claude Certified Associate – Foundations 시험 준비 코스. 영역별 레슨, 영어 연습 문제, 모의고사.">
<script>/* 테마: 직접 고른 값이 있을 때만 적용. 없으면 기기 설정을 따름 */
try{ var __t = localStorage.getItem("ccao_theme"); if(__t==="dark"||__t==="light") document.documentElement.dataset.theme = __t; }catch(e){}</script>
<script>/* 오프라인 캐시: GitHub Pages 주소로 열었을 때만 등록 */
try{ if("serviceWorker" in navigator && /github\.io$/.test(location.hostname)) window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* 레이아웃: 상단 고정 헤더 + 가운데 정렬 단일 칼럼(홈 1080px, 레슨 720px). 다크 기본, 라이트 대응 */
  :root{
    --bg:#121615; --surface:#191e1d; --surface2:#222927; --line:#2d3533;
    --text:#ebefed; --muted:#93a19d; --dim:#5d6a66;
    --accent:#5fbfa9; --accent-soft:rgba(95,191,169,.13); --accent-line:rgba(95,191,169,.34);
    --on-accent:#0d1714;
    --ok:#8cc461; --ok-soft:rgba(140,196,97,.11); --ok-line:rgba(140,196,97,.36);
    --no:#e0675f; --no-soft:rgba(224,103,95,.11); --no-line:rgba(224,103,95,.36);
    --warn:#dcae58; --warn-soft:rgba(220,174,88,.11); --warn-line:rgba(220,174,88,.36);
    --header:rgba(18,22,21,.88); --code-bg:#1f2826; --code-tx:#9fdccd; --shade:rgba(0,0,0,.55);
    --d1:#7fb2e5; --d2:#5fbfa9; --d3:#c9a0dc; --d4:#e0b25e; --d5:#8cc461; --d6:#e0807a; --d7:#9aa5a2;
    --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --radius:14px;
    --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
    --bg:#f5f7f6; --surface:#ffffff; --surface2:#e9eeec; --line:#d9e1de;
    --text:#1b2321; --muted:#63706c; --dim:#a1ada9;
    --accent:#1f7a68; --accent-soft:rgba(31,122,104,.09); --accent-line:rgba(31,122,104,.3);
    --on-accent:#ffffff;
    --ok:#3d7f1f; --ok-soft:rgba(61,127,31,.09); --ok-line:rgba(61,127,31,.3);
    --no:#c2423c; --no-soft:rgba(194,66,60,.08); --no-line:rgba(194,66,60,.3);
    --warn:#9c7420; --warn-soft:rgba(156,116,32,.09); --warn-line:rgba(156,116,32,.3);
    --header:rgba(245,247,246,.9); --code-bg:#e6f0ed; --code-tx:#17604f; --shade:rgba(20,30,28,.35);
    --d1:#2f6fae; --d2:#1f7a68; --d3:#8a55a6; --d4:#a5741c; --d5:#3d7f1f; --d6:#b84a43; --d7:#5f6b68;
    color-scheme:light;
  }}
  :root[data-theme="light"]{
    --bg:#f5f7f6; --surface:#ffffff; --surface2:#e9eeec; --line:#d9e1de;
    --text:#1b2321; --muted:#63706c; --dim:#a1ada9;
    --accent:#1f7a68; --accent-soft:rgba(31,122,104,.09); --accent-line:rgba(31,122,104,.3);
    --on-accent:#ffffff;
    --ok:#3d7f1f; --ok-soft:rgba(61,127,31,.09); --ok-line:rgba(61,127,31,.3);
    --no:#c2423c; --no-soft:rgba(194,66,60,.08); --no-line:rgba(194,66,60,.3);
    --warn:#9c7420; --warn-soft:rgba(156,116,32,.09); --warn-line:rgba(156,116,32,.3);
    --header:rgba(245,247,246,.9); --code-bg:#e6f0ed; --code-tx:#17604f; --shade:rgba(20,30,28,.35);
    --d1:#2f6fae; --d2:#1f7a68; --d3:#8a55a6; --d4:#a5741c; --d5:#3d7f1f; --d6:#b84a43; --d7:#5f6b68;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#121615; --surface:#191e1d; --surface2:#222927; --line:#2d3533;
    --text:#ebefed; --muted:#93a19d; --dim:#5d6a66;
    --accent:#5fbfa9; --accent-soft:rgba(95,191,169,.13); --accent-line:rgba(95,191,169,.34);
    --on-accent:#0d1714;
    --ok:#8cc461; --ok-soft:rgba(140,196,97,.11); --ok-line:rgba(140,196,97,.36);
    --no:#e0675f; --no-soft:rgba(224,103,95,.11); --no-line:rgba(224,103,95,.36);
    --warn:#dcae58; --warn-soft:rgba(220,174,88,.11); --warn-line:rgba(220,174,88,.36);
    --header:rgba(18,22,21,.88); --code-bg:#1f2826; --code-tx:#9fdccd; --shade:rgba(0,0,0,.55);
    --d1:#7fb2e5; --d2:#5fbfa9; --d3:#c9a0dc; --d4:#e0b25e; --d5:#8cc461; --d6:#e0807a; --d7:#9aa5a2;
    color-scheme:dark;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:60;background:var(--header)}
  ::selection{background:var(--accent);color:var(--on-accent)}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .muted{color:var(--muted)}
  h1,h2,h3{text-wrap:balance}

  header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:50;background:var(--header);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .hwrap{max-width:1080px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);height:60px;display:flex;align-items:center;gap:18px}
  .logo{font-weight:700;letter-spacing:.06em;font-size:15px;cursor:pointer;white-space:nowrap;background:none;border:0;color:var(--text);padding:0}
  .logo em{color:var(--accent);font-style:normal}
  nav{display:flex;gap:4px;flex:1;min-width:0}
  nav button{background:none;border:0;color:var(--muted);font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap}
  nav button:hover{color:var(--text)}
  nav button.on{color:var(--text);background:var(--surface2)}
  .hright{display:flex;align-items:center;gap:8px;margin-left:auto}
  .icon-btn{background:var(--surface2);border:1px solid var(--line);border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:.15s}
  .icon-btn:hover{border-color:var(--dim)}
  .dday .dshort{display:none}
  @media(max-width:700px){ .dday .dshort{display:inline} }
  .dday{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:5px 12px;border-radius:99px;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}

  .wrap{max-width:1080px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
  .hero{padding-block:52px 30px}
  .hero h1{font-size:clamp(25px,4vw,38px);font-weight:700;letter-spacing:-.02em;line-height:1.32;margin:14px 0 16px}
  .hero h1 .ac{color:var(--accent)}
  .hero p{max-width:640px;color:var(--muted);font-size:15px}
  .hero .cta{margin-top:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border:0;font-weight:700;cursor:pointer;border-radius:10px;transition:.15s}
  .btn-primary{background:var(--accent);color:var(--on-accent);padding:13px 24px;font-size:15px}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-primary:disabled{opacity:.35;cursor:default}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:12px 18px;font-size:14px}
  .btn-ghost:hover{color:var(--text);border-color:var(--dim)}
  .btn-ghost:disabled{opacity:.35;cursor:default}
  .btn-danger{background:transparent;color:var(--no);border:1px solid var(--no-line);padding:12px 18px;font-size:14px}
  .btn-sm{padding:8px 14px;font-size:13px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:8px 0 40px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .stat .k{font-size:12px;color:var(--muted);margin-bottom:6px}
  .stat .v{font-size:21px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:4px}

  .sec{margin-bottom:52px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px}
  .sec-head h2{font-size:21px;font-weight:700;letter-spacing:-.01em;margin-top:6px}
  .sec-head .note{font-size:13px;color:var(--muted)}

  /* 출제 비중 막대 */
  .wbar{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .wbar span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--on-accent);min-width:0;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
  .wlegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 18px;margin-top:12px}
  .wlegend div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
  .wlegend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .wlegend b{color:var(--text);font-weight:600}
  .howto{font-size:12.5px;color:var(--muted);margin-top:10px}
  .howto b{color:var(--text);margin-right:4px}

  .parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .part{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;transition:.18s;text-align:left;color:var(--text);width:100%;display:block}
  .part:hover{border-color:var(--dim);transform:translateY(-2px)}
  .part.locked{opacity:.55}
  .part .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .part .num{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.14em}
  .part .dom{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;color:var(--on-accent)}
  .part .en{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:12px}
  .part h3{font-size:17px;font-weight:700;margin:6px 0 10px;letter-spacing:-.01em}
  .part .meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
  .part .meta b{color:var(--text);font-weight:700}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .badge.weak{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
  .badge.strong{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
  .pbar{height:4px;background:var(--surface2);border-radius:99px;margin-top:14px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

  /* 파트 페이지 */
  .ppage{max-width:780px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:36px 90px}
  .ppage .phead{margin-bottom:24px}
  .ppage h1{font-size:25px;font-weight:700;letter-spacing:-.015em;margin:8px 0 10px}
  .ppage .pdesc{color:var(--muted);font-size:14.5px}
  .crumb{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:0;margin-bottom:14px}
  .crumb:hover{color:var(--text)}
  .res{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:13.5px}
  .res dt{color:var(--muted);font-size:12.5px}
  .res dd{min-width:0}
  .res a{color:var(--accent)}
  .lrow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s;width:100%;text-align:left;color:var(--text)}
  .lrow:hover{border-color:var(--dim)}
  .lrow .st{width:26px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;border:1.5px solid var(--line);color:var(--dim)}
  .lrow .st.done{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
  .lrow .st.now{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .lrow .li{flex:1;min-width:0}
  .lrow .lt{font-size:14.5px;font-weight:700}
  .lrow .ls{font-size:12px;color:var(--muted)}
  .lrow .lr{font-size:12px;color:var(--muted);white-space:nowrap}
  .lrow.test{border-style:dashed}

  /* 레슨 */
  .lesson-top{border-bottom:1px solid var(--line);background:var(--surface)}
  .lt-wrap{max-width:720px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:12px;display:flex;align-items:center;gap:14px}
  .lt-wrap .back{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px}
  .lt-wrap .info{flex:1;min-width:0}
  .lt-wrap .info .t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lt-wrap .info .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .segs{display:flex;gap:5px;width:140px;flex-shrink:0}
  .segs i{flex:1;height:4px;border-radius:99px;background:var(--surface2)}
  .segs i.done{background:var(--accent)}
  .segs i.now{background:var(--text)}

  .stage{max-width:720px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:40px 150px}
  .step{animation:fadein .3s ease}
  @keyframes fadein{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .step,.fb,.toast,.modal-bg{animation:none} .part:hover{transform:none} }
  .step .kind{margin-bottom:14px}
  .step h2{font-size:23px;font-weight:700;letter-spacing:-.015em;line-height:1.38;margin-bottom:18px}
  .prose{font-size:15.5px;color:var(--text)}
  .prose p{margin-bottom:13px}
  .prose .lead{color:var(--muted)}
  .prose ul,.prose ol{margin:0 0 16px}
  .prose ul{list-style:none}
  .prose ul>li{padding-left:20px;position:relative;margin-bottom:9px}
  .prose ul>li::before{content:"•";position:absolute;left:4px;color:var(--accent);font-weight:700}
  .prose ol{padding-left:22px}
  .prose ol>li{margin-bottom:8px;padding-left:2px}
  .prose li ul{margin:8px 0 0}
  .prose li li::before{content:"–";color:var(--dim)}
  .prose h4{font-size:12.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:22px 0 10px;font-weight:700}
  .prose code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--code-tx)}
  .prose pre,.sample{font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0 18px;overflow-x:auto;white-space:pre-wrap;color:var(--text)}
  .sample .sl{display:block;font-family:var(--font);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
  .sample.bad{border-left:3px solid var(--no)}
  .sample.good{border-left:3px solid var(--ok)}
  .tbl{overflow-x:auto;margin:14px 0}
  .prose table{width:100%;border-collapse:collapse;font-size:13.5px}
  .prose th,.prose td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  .prose th{background:var(--surface2);font-size:12px;color:var(--muted)}
  .callout{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:13px 16px;font-size:14px;margin:18px 0;color:var(--text)}
  .callout.term{border-left-color:var(--d1)}
  .callout.warn{border-left-color:var(--warn)}
  .flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
  .flow .nd{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;text-align:center;flex:1 1 120px;min-width:0}
  .flow .nd small{display:block;font-size:11px;color:var(--muted);font-weight:500}
  .flow .nd.hot{border-color:var(--accent-line);background:var(--accent-soft)}
  .flow .ar{align-self:center;color:var(--dim);font-size:14px}

  /* 업무 흐름 지도 */
  .amap{border:1px dashed var(--line);border-radius:12px;padding:14px;margin:4px 0 22px;background:var(--surface)}
  .amap .amt{font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:6px}
  .amap .amcap{font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.55}
  .amap .arow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin-bottom:7px}
  .amap .ab{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11.5px;color:var(--muted);background:var(--surface2);display:flex;flex-direction:column;justify-content:center;text-align:center;flex:1 1 92px;min-width:0}
  .amap .ab b{color:var(--text);font-weight:600;font-size:12px}
  .amap .ab small{font-size:10.5px;color:var(--dim)}
  .amap .aarr{align-self:center;color:var(--dim);font-size:12px}
  .amap .inrow{display:flex;gap:4px;margin-top:5px;justify-content:center;flex-wrap:wrap}
  .amap .abi{border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:10.5px;color:var(--muted);background:var(--bg)}
  .amap .on{border-color:var(--accent) !important;background:var(--accent-soft) !important;color:var(--accent) !important;box-shadow:0 0 0 1px var(--accent-line)}
  .amap .on b,.amap .on small{color:var(--accent)}

  .opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .opt{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px;text-align:left;color:var(--text);cursor:pointer;display:flex;gap:12px;transition:.15s;width:100%}
  .opt:hover:not(:disabled){border-color:var(--dim)}
  .opt .abc{font-weight:700;color:var(--muted);flex-shrink:0}
  .opt>span:last-child{min-width:0}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.right{border-color:var(--ok);background:var(--ok-soft)}
  .opt.wrong{border-color:var(--no);background:var(--no-soft);opacity:.85}
  .opt:disabled{cursor:default}
  .multi-note{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:8px;padding:3px 10px}

  .fb{border-radius:12px;padding:15px 18px;margin-top:18px;font-size:14.5px;animation:fadein .25s ease}
  .fb.hint{background:var(--warn-soft);border:1px solid var(--warn-line)}

/* ================= 저장소 (브라우저 저장이 막혀도 화면은 동작) ================= */
const KEY = "ccao_data";
let MEM = {};
const store = {
  get(){ try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : MEM; }catch(e){ return MEM; } },
  set(d){ MEM = d; try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} },
  lesson(id){ const s=this.get(); return (s.lessons||{})[id] || {step:0, done:false, answers:{}}; },
  saveLesson(id, ls){ const s=this.get(); s.lessons=s.lessons||{}; s.lessons[id]=ls; this.set(s); },
  test(id){ const s=this.get(); return (s.tests||{})[id] || null; },
  saveTest(id, r){ const s=this.get(); s.tests=s.tests||{}; s.tests[id]=r; this.set(s); },
  addLog(entry){ const s=this.get(); s.log=s.log||[]; s.log.push(entry); if(s.log.length>2000) s.log=s.log.slice(-2000); this.set(s); },
  lastExam(){ return this.get().lastExam || null; },
  saveLastExam(v){ const s=this.get(); s.lastExam=v; this.set(s); }
};
function allPoolQuestions(){
  const out = [];
  PARTS.filter(p=>p.dom).forEach(p=>partLessons(p.key).forEach(L=>{
    (L.steps||[]).filter(s=>s.type==="quiz").forEach(q=>out.push(q));
    (L.questions||[]).forEach(q=>out.push(q));
  }));
  (window.CCAO_EXTRA||[]).forEach(q=>out.push(q));
  return out;
}
function qTotal(){
  let n = 0;
  Object.values(C).forEach(p=>(p.lessons||[]).forEach(L=>{
    n += (L.steps||[]).filter(s=>s.type==="quiz").length + (L.questions||[]).length;
  }));
  return n + (window.CCAO_EXTRA||[]).length;
}
function accuracy(){
  const s = store.get(); let right=0, total=0;
  Object.values(s.lessons||{}).forEach(ls=>Object.values(ls.answers||{}).forEach(a=>{
    if(a.outcome){ total++; if(a.outcome==="right") right++; }
  }));
  return {right, total};
}
function partProgress(key){
  const ls = partLessons(key); let done = 0;
  ls.forEach(L=>{
    if(L.type==="test" || L.type==="exam"){ if(store.test(L.id)) done++; }
    else if(store.lesson(L.id).done) done++;
  });
  return {done, total: ls.length};
}
function doneUnits(){ return PARTS.reduce((a,p)=>a+partProgress(p.key).done,0); }

/* ===== 선택지 셔플 =====
   레슨 연습 문제: attemptSalt=0 → 문항별로 순서 고정 (저장된 기록 복원용)
   미니테스트·모의고사: 응시마다 attemptSalt 갱신 → 선택지 순서가 매번 바뀜 */
let attemptSalt = 0;
function qHash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h)||1; }
function qPerm(q){
  const n = q.opts.length, idx = [...Array(n).keys()];
  let seed = ((qHash((q.q||"") + (q.h||"")) ^ attemptSalt) & 0x7fffffff) || 1;
  for(let i=n-1;i>0;i--){ seed = (Math.imul(seed, 1103515245) + 12345) & 0x7fffffff; const j = (seed >>> 8) % (i+1); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx;
}
function displayOpts(q){
  const perm = qPerm(q);
  const wrongMap = {}; let w = 0;
  q.opts.forEach((o,i)=>{ if(!o.ok) wrongMap[i] = ((q.explain && q.explain.wrongs)||[])[w++]; });
  return perm.map((orig,p)=>({ t:q.opts[orig].t, ko:q.opts[orig].ko, ok:!!q.opts[orig].ok, wrongText:wrongMap[orig], letter:"ABCDE"[p] }));
}
function relabel(text, letter){ return text ? text.replace(/^(<b>)[A-E]/, "$1"+letter) : text; }
function dispWrongs(q){ return displayOpts(q).filter(o=>!o.ok).map(o=>relabel(o.wrongText||"", o.letter)); }
function dispOkIdx(q){ return displayOpts(q).findIndex(o=>o.ok); }
function dispOkIdxs(q){ return displayOpts(q).map((o,i)=>o.ok? i : -1).filter(i=>i>=0); }
function qid(q){ return qHash((q.q||"") + (q.opts||[]).map(o=>o.t).join("|")); }
function ansRight(q, ans){
  if(q.multi){
    if(!Array.isArray(ans)) return false;
    const okI = dispOkIdxs(q);
    return ans.length === okI.length && okI.every(i=>ans.includes(i));
  }
  return ans!=null && !!(displayOpts(q)[ans] && displayOpts(q)[ans].ok);
}
function ansLabel(ans){ return Array.isArray(ans) ? ans.map(i=>"ABCDE"[i]).join(", ") : "ABCDE"[ans]; }
function domOf(q){ return "D"+String(q.ts||"0").split(".")[0]; }

function nextUp(){
  for(const p of PARTS){
    const ls = partLessons(p.key);
    for(let i=0;i<ls.length;i++){
      const L = ls[i];
      if(L.type==="test" || L.type==="exam"){ if(!store.test(L.id)) return {pk:p.key, idx:i, L, meta:p}; }
      else if(!store.lesson(L.id).done) return {pk:p.key, idx:i, L, meta:p};
    }
  }
  return null;
}
function unitLabel(L){ return L.type==="test"||L.type==="exam" ? L.title : (L.ch? L.ch+" · ":"") + L.title; }

/* ================= 3주 코스 ================= */
function examDate(){ return store.get().examDate || null; }
function setExamDate(v){ if(!v){ toast("날짜를 선택할 것"); return; } const s = store.get(); s.examDate = v; store.set(s); renderHome(); toast("응시일이 " + v + "로 설정됨"); }
function daysBetween(a,b){ return Math.round((b - a)/86400000); }
function today0(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function sprintPos(){
  const ed = examDate(); if(!ed) return null;
  const parts = ed.split("-").map(Number);
  const exam = new Date(parts[0], parts[1]-1, parts[2]);
  const total = (window.CCAO_SPRINT && window.CCAO_SPRINT.days) || 21;
  const start = new Date(exam); start.setDate(start.getDate() - total);
  const dday = daysBetween(today0(), exam);
  const day = daysBetween(start, today0());
  return {exam, start, dday, day, total};
}
function itemDone(it){
  if(it.t === "do") return false;
  if(it.t === "test" || it.t === "exam") return !!store.test(it.id);
  return !!store.lesson(it.id).done;
}
function findUnit(it){ const ls = partLessons(it.pk); const i = ls.findIndex(l=>l.id===it.id); return i<0? null : {L:ls[i], i}; }
function itemLabel(it){ if(it.t === "do") return it.label; const u = findUnit(it); return u? unitLabel(u.L) : it.id; }
function itemKind(it){ return it.t==="exam"? "모의고사" : it.t==="test"? "미니테스트" : it.t==="do"? "직접 수행" : "레슨"; }
function openItem(d, i){
  const it = (window.CCAO_SPRINT.plan.find(x=>x.d===d)||{items:[]}).items[i]; if(!it) return;
  if(it.t === "do"){ if(it.go==="appendix") renderAppendix(); else if(it.go==="exam") openExam(); else toast("사이트 밖에서 직접 수행하는 항목임"); return; }
  const u = findUnit(it); if(!u){ toast("레슨을 찾을 수 없음"); return; }
  openUnit(it.pk, u.i);
}
function sitemHTML(d, it, i){
  const done = itemDone(it);
  if(it.t==="do" && it.url) return `<a class="sitem" href="${it.url}" target="_blank" rel="noopener" style="text-decoration:none">
    <span class="sck">${i+1}</span><span class="stx">${it.label} ↗</span><span class="sk">공식 강좌</span></a>`;
  return `<button class="sitem ${it.t==="do" && !it.go?"plain":""}" onclick="openItem(${d.d},${i})">
    <span class="sck ${done?"done":""}">${done?"✓":i+1}</span>
    <span class="stx">${itemLabel(it)}</span><span class="sk">${itemKind(it)}</span></button>`;
}
function dayPlan(n){ return ((window.CCAO_SPRINT||{}).plan||[]).find(d=>d.d===n) || null; }
function sprintCardHTML(){
  const S = window.CCAO_SPRINT; if(!S) return "";
  const pos = sprintPos();
  const def = new Date(Date.now()+22*86400000); const defStr = def.getFullYear()+"-"+String(def.getMonth()+1).padStart(2,"0")+"-"+String(def.getDate()).padStart(2,"0");
  if(!pos) return `<div class="setup">
      <h3>응시일 설정</h3>
      <p>응시일을 입력하면 그 날짜에서 거꾸로 계산한 21일 코스가 만들어짐. 하루 60~90분 기준. 홈에는 그날 할 항목만 표시됨. Pearson VUE 예약 전이면 목표일을 임의로 넣어도 됨.</p>
      <div><label for="edInput" class="muted" style="font-size:13px">응시일</label> <input type="date" id="edInput" value="${defStr}">
      <button class="btn btn-primary btn-sm" onclick="setExamDate(document.getElementById('edInput').value)">코스 시작</button></div>
    </div>`;
  if(pos.day < 1) return `<div class="setup"><h3>코스 시작일: ${pos.start.getMonth()+1}월 ${pos.start.getDate()}일</h3>
      <p>응시일까지 D-${pos.dday}. 21일 코스는 아직 시작 전임. 먼저 진행하려면 전체 코스에서 Day 1부터 열 것.</p>
      <button class="btn btn-ghost btn-sm" onclick="renderSprint()">전체 코스 보기</button></div>`;
  const n = Math.min(pos.day, pos.total);
  const d = dayPlan(n); if(!d) return "";
  const done = d.items.filter(itemDone).length;
  return `<div class="sprint">
    <div class="sh"><span class="sday">DAY ${d.d} / ${pos.total} · WEEK ${d.w} · ${d.min}분</span>
      <span class="badge ${done===d.items.length? "strong":""}">${done} / ${d.items.length} 완료</span></div>
    <h3>${d.title}</h3>
    ${d.why? `<div class="swhy">${d.why}</div>` : ""}
    ${d.items.map((it,i)=>sitemHTML(d,it,i)).join("")}
    <div class="sfoot"><button class="btn btn-ghost btn-sm" onclick="renderSprint()">전체 21일 코스</button>
      <span class="muted" style="font-size:12.5px">응시일 ${pos.exam.getMonth()+1}/${pos.exam.getDate()} · D-${pos.dday}</span>
      <button class="btn btn-ghost btn-sm" onclick="resetExamDate()">응시일 다시 설정</button></div>
  </div>`;
}
function resetExamDate(){ const s = store.get(); s.examDate = null; store.set(s); renderHome(); }
function renderSprint(){
  const S = window.CCAO_SPRINT; const pos = sprintPos();
  setTab("sprint");
  if(!S){ toast("3주 코스를 준비 중임"); return; }
  view.innerHTML = `
  <div class="ppage" style="max-width:860px">
    <button class="crumb" onclick="go('home')">← 홈</button>
    <div class="phead"><div class="eyebrow">SPRINT</div>
      <h1>3주 코스 · 21일</h1>
      <div class="pdesc">${S.desc}</div>
    </div>
    ${pos? "" : sprintCardHTML()}
    <div class="wkrow">${S.weeks.map(w=>`<div class="wk"><div class="wn">WEEK ${w.no}</div><b>${w.title}</b><span>${w.desc}</span></div>`).join("")}</div>
    ${S.plan.map(d=>{
      const done = d.items.filter(itemDone).length;
      const cls = pos? (d.d===Math.min(pos.day,pos.total)? "now" : d.d < pos.day? "past" : "") : "";
      return `<div class="dayrow ${cls}">
        <div class="dh"><span class="dn">DAY ${d.d} · ${d.min}분</span><span class="badge ${done===d.items.length?"strong":""}">${done}/${d.items.length}</span></div>
        <div class="dt">${d.title}</div>

        ${d.items.map((it,i)=>sitemHTML(d,it,i)).join("")}
      </div>`;
    }).join("")}
  </div>`;
  window.scrollTo(0,0);
}

const KO_MODES = ["off","click","free"];
const KO_LABEL = {off:"번역 끔", click:"문장 클릭", free:"항상 표시"};
let koLocked = false;
function koMode(){ const m = store.get().koMode; return KO_MODES.includes(m) ? m : "click"; }
function setKoMode(m){ const s = store.get(); s.koMode = m; store.set(s); applyKo(); }
function cycleKo(){
  if(koLocked){ toast("모의고사 중에는 한국어 번역이 잠김. 실전과 같은 조건임"); return; }
  const i = KO_MODES.indexOf(koMode()); setKoMode(KO_MODES[(i+1)%3]);
  toast("한국어 번역: " + KO_LABEL[koMode()]);
}
function applyKo(){
  const m = koLocked ? "off" : koMode();
  document.body.dataset.ko = m;
  const lbl = document.getElementById("koLbl"); if(lbl) lbl.textContent = koLocked ? "실전 잠금" : KO_LABEL[m];
  const btn = document.getElementById("koBtn"); if(btn) btn.classList.toggle("on", !koLocked && m !== "off");
}
function lockKo(v){ koLocked = v; applyKo(); }
function koQ(text, ko){
  if(!ko) return text;
  return `<span class="sen" onclick="this.classList.toggle('on')">${text}</span><span class="kog">${ko}</span>`;
}
function koOpt(ko){ return ko ? `<div class="optko">${ko}</div>` : ""; }
function koToggleStep(btn){
  const step = btn.closest(".step");
  const on = step.classList.toggle("koshow");
  btn.textContent = on ? "한국어 번역 끄기" : "한국어 번역 켜기";
}
function koBar(q){ return q && q.ko ? '<div class="kobar"><button onclick="koToggleStep(this)">한국어 번역 켜기</button></div>' : ""; }

  if(t) return t;
  try{ return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; }catch(e){ return "dark"; }

function applyThemeIcon(){ const b = document.getElementById("themeBtn"); if(b) b.textContent = curTheme()==="dark" ? "☀" : "☾"; }

  const t = curTheme()==="dark" ? "light" : "dark";

  try{ localStorage.setItem("ccao_theme", t); }catch(e){}
  applyThemeIcon();

function applyDday(){

function askConfirm(title, msg, yesLabel, onYes, danger){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.onclick = e => { if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <h3>${title}</h3><div class="msub">${msg}</div>
    <div class="mrow"><button class="btn ${danger? "btn-danger":"btn-primary"}" id="askYes">${yesLabel}</button>
    <button class="btn btn-ghost" id="askNo">취소</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector("#askNo").onclick = ()=>bg.remove();
  bg.querySelector("#askYes").onclick = ()=>{ bg.remove(); onYes(); };
  bg.querySelector("#askYes").focus();
}

  <div class="ppage">

      <dt>시점</dt><dd>이 파트를 시작하기 전이나 끝낸 뒤 어느 쪽이든 가능. 둘 다 마친 뒤 미니테스트 응시</dd>
      <dt>링크</dt><dd><a href="${PREP+meta.slug}" target="_blank" rel="noopener">Partner Academy에서 열기 ↗</a> <span class="muted">(파트너 계정 로그인 필요)</span></dd>

    ${ls.map((L,i)=>{

function openUnit(pk, idx){
  const L = partLessons(pk)[idx]; if(!L) return;

  else openLesson(pk, idx);
}

/* ================= 레슨 ================= */
let ctx = null;
let cur = 0, quizState = {};
function openLesson(pk, idx){
  attemptSalt = 0;
  const L = partLessons(pk)[idx];
  ctx = {pk, idx, L};
  const saved = store.lesson(L.id);
  quizState = saved.answers || {};
  cur = saved.done ? 0 : Math.min(saved.step||0, L.steps.length-1);
  renderStep();
}
function persist(){
  const L = ctx.L; const saved = store.lesson(L.id);
  store.saveLesson(L.id, {
    step: cur >= L.steps.length ? L.steps.length-1 : cur,
    done: saved.done || cur >= L.steps.length,
    answers: quizState
  });
}
function segs(){ return `<div class="segs">${ctx.L.steps.map((_,i)=>`<i class="${i<cur?"done":i===cur?"now":""}"></i>`).join("")}</div>`; }
function objHTML(L){
  if(!L.obj || !OBJ[L.obj]) return "";
  return `<details class="callout" style="margin-top:28px"><summary style="cursor:pointer;font-weight:600;font-size:13.5px">출제 목표 ${L.obj} · ${OBJ[L.obj][1]}</summary>
    <p style="margin-top:8px;font-size:13px" class="muted">공식 가이드 표기: <span lang="en">${OBJ[L.obj][0]}</span>. 이 레슨의 설명과 문항은 이 목표를 기준으로 작성됨.</p></details>`;
}
function renderStep(){
  const L = ctx.L;
  const done = cur >= L.steps.length;
  const st = L.steps[cur];
  const qs = st && st.type==="quiz" ? quizState[cur] : null;
  view.innerHTML = `
    <div class="lesson-top"><div class="lt-wrap">
      <button class="back" onclick="persist();openPart(ctx.pk)" title="파트로 돌아가기 (진도 저장됨)" aria-label="파트로 돌아가기">←</button>
      <div class="info"><div class="t">${unitLabel(L)}</div><div class="s">${L.obj? "출제 목표 "+L.obj+" · ":""}진도 자동 저장</div></div>
      ${segs()}
    </div></div>
    <div class="stage">${ done? doneHTML() : stepHTML(st) + (cur===L.steps.length-1? objHTML(L):"") }</div>
    ${ done? "" : `<div class="bbar"><div class="bb-wrap">
        <button class="btn btn-ghost" onclick="prevStep()" ${cur===0?"disabled":""}>← 이전</button>
        <span class="pos">${cur+1} / ${L.steps.length}</span>
        <div class="grp"><button class="btn btn-primary" id="nextBtn" ${stepCleared(st, qs) ? "":"disabled"} onclick="nextStep()">계속 →</button></div>
      </div></div>`}`;
  if(st && st.type==="quiz" && qs && qs.resolved) restoreQuiz(st, qs);
  window.scrollTo(0,0);
}

/* 업무 처리 흐름 지도: 콘텐츠의 __MAP:구역__ 토큰을 그림으로 바꿈 */
function aoMap(z){
  const on = k => z===k ? "on" : "";
  const pickOn = ["pick","feat","model","ctx"].includes(z) ? "on" : "";
  return `<div class="amap"><div class="amt">업무 처리 흐름 지도 · 현재 학습 위치</div>
    <div class="amcap">읽는 법: 윗줄 = 업무 한 건을 처리하는 순서(왼쪽 → 오른쪽). 가운데 줄 = 결과가 나쁠 때 되돌아가는 경로. 아랫줄 = 모든 단계에 함께 적용되는 기준. 칸 안 D 번호 = 시험 출제 영역. 강조된 칸이 지금 배우는 곳.</div>
    <div class="arow">
      <div class="ab ${pickOn}"><b>① 도구·모델 선택</b><small>D3</small><div class="inrow"><span class="abi ${on("feat")}">기능</span><span class="abi ${on("model")}">모델</span><span class="abi ${on("ctx")}">컨텍스트</span></div></div>
      <div class="aarr">→</div>
      <div class="ab ${on("setup")}"><b>② 환경 설정</b><small>D5 · 지시문·지식</small></div>
      <div class="aarr">→</div>
      <div class="ab ${on("prompt")}"><b>③ 요청 작성</b><small>D1 · 프롬프트·분해</small></div>
      <div class="aarr">→</div>
      <div class="ab ${on("verify")}"><b>④ 결과 검증·다듬기</b><small>D2 · 확인·수정·형식</small></div>
      <div class="aarr">→</div>
      <div class="ab ${on("apply")}"><b>⑤ 업무 적용</b><small>D4 · 흐름 설계·공유</small></div>
    </div>
    <div class="arow"><div class="ab ${on("fix")}" style="flex:1 1 100%"><b>↩ 결과 불량 → 원인 진단·수정 → ②·③으로 복귀</b><small>D7</small></div></div>
    <div class="arow"><div class="ab ${on("gov")}" style="flex:1 1 100%"><b>전 단계 공통: 데이터 민감도 · 조직 정책 · 사람 검토와 승인</b><small>D6</small></div></div>
  </div>`;
}
function renderTokens(html){ return String(html).replace(/__MAP:(\w*)__/g, (m,z)=>aoMap(z)); }

function briefHTML(st){
  if(!st.brief) return "";
  const b = st.brief;
  return `<div class="brief"><div class="bt">${b.title||"SITUATION"}</div><div class="bb">${koQ(b.body, b.ko)}</div></div>`;
}
function whyHTML(st){
  if(!st.why) return "";
  const qs = quizState[cur] || {};
  const w = st.why;
  const shown = displayOpts({q:w.q, opts:w.opts});
  if(qs.whyOk){
    return `<div class="why"><div class="wt">✓ 이유 확인 완료</div><div class="wq">${w.q}</div>
      <div class="wopts">${shown.map((o,i)=>`<button class="wopt ${o.ok?"right":""}" disabled><span class="abc">${"ABCDE"[i]}</span><span>${o.t}</span></button>`).join("")}</div>
      ${w.explain? `<div class="wdone">${w.explain}</div>` : ""}</div>`;
  }
  return `<div class="why"><div class="wt">이유 확인: 왜 이것이 정답인가</div><div class="wq">${w.q}</div>
    <div class="wsub">정답을 맞혔더라도 이유를 모르면 비슷한 문항에서 다시 틀림. 정확한 이유를 골라야 다음으로 진행됨.</div>
    <div class="wopts">${shown.map((o,i)=>`<button class="wopt" id="wopt${i}" onclick="whyPick(${i})"><span class="abc">${"ABCDE"[i]}</span><span>${o.t}</span></button>`).join("")}</div>
    <div id="wfb"></div></div>`;
}
function whyPick(i){
  const st = ctx.L.steps[cur], qs = quizState[cur];
  if(qs.whyOk) return;
  const shown = displayOpts({q:st.why.q, opts:st.why.opts});
  const btn = document.getElementById("wopt"+i);
  if(shown[i].ok){
    qs.whyOk = true;
    document.querySelectorAll(".wopt").forEach(b=>b.disabled=true);
    btn.classList.add("right");
    if(st.why.explain) document.getElementById("wfb").innerHTML = `<div class="wdone">${st.why.explain}</div>`;
    document.getElementById("nextBtn").disabled = false;
    persist();
  } else {
    btn.classList.add("wrong"); btn.disabled = true;
    qs.whyWrong = (qs.whyWrong||0) + 1;
    document.getElementById("wfb").innerHTML = `<div class="wdone" style="border-color:var(--no-line)">해당 이유가 아님. 남은 선택지를 다시 확인할 것.</div>`;
    persist();
  }
}
function stepCleared(st, qs){
  if(!st || st.type !== "quiz") return true;
  if(!qs || !qs.resolved) return false;
  if(st.why && !qs.whyOk) return false;
  return true;
}
function stepHTML(st){
  if(st.type==="concept"){
    return `<div class="step">${briefHTML(st)}<div class="kind"><span class="eyebrow">${st.kind}</span></div><h2>${st.h}</h2><div class="prose">${renderTokens(st.html)}</div></div>`;
  }
  if(!quizState[cur]) quizState[cur] = {tries:0, resolved:false, wrong:[]};
  return `<div class="step">${briefHTML(st)}<div class="kind"><span class="eyebrow">${st.kind}</span></div>
    <h2>${st.h}</h2>
    <div class="prose"><p>${koQ(st.q, st.ko)}</p></div>
    ${koBar(st)}
    <div class="opts">${displayOpts(st).map((o,i)=>`
      <button class="opt" id="opt${i}" onclick="pick(${i})"><span class="abc">${"ABCDE"[i]}</span><span>${o.t}${koOpt(o.ko)}</span></button>`).join("")}
    </div>
    <div id="fb"></div></div>`;
}
function restoreQuiz(st, qs){
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  (qs.wrong||[]).forEach(i=>{ const e = document.getElementById("opt"+i); if(e) e.classList.add("wrong"); });
  const okIdx = dispOkIdx(st);
  const e = document.getElementById("opt"+okIdx); if(e) e.classList.add("right");
  document.getElementById("fb").innerHTML = qs.outcome==="right" ? goodFB(st, qs, true) : badFB(st, okIdx, true);
}
function goodFB(st, qs, restored){
  return `<div class="fb good"><div class="fb-t">✓ 정답${restored? " (기록됨)": qs.tries===0? " · 한 번에 맞힘":" · 힌트 확인 후 맞힘"}</div>
    ${st.explain.good}
    <ul>${dispWrongs(st).map(w=>`<li>${w}</li>`).join("")}</ul>
    ${st.principle? `<span class="chip">${st.principle}</span>`:""}</div>` + whyHTML(st);
}
function badFB(st, okIdx, restored){
  return `<div class="fb bad"><div class="fb-t">정답은 ${"ABCDE"[okIdx]}임${restored? " (오답 기록됨)":" · 오답으로 기록됨"}</div>
    ${st.explain.good}
    <ul>${dispWrongs(st).map(w=>`<li>${w}</li>`).join("")}</ul>
    ${st.principle? `<span class="chip">${st.principle}</span>`:""}</div>` + whyHTML(st);
}
function pick(i){
  const st = ctx.L.steps[cur]; const qs = quizState[cur];
  if(qs.resolved) return;
  const fb = document.getElementById("fb"); const btn = document.getElementById("opt"+i);
  const today = new Date().toISOString().slice(0,10);
  if(displayOpts(st)[i].ok){
    qs.resolved = true; qs.outcome = "right";
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    btn.classList.add("right");
    fb.innerHTML = goodFB(st, qs, false);
    document.getElementById("nextBtn").disabled = !stepCleared(st, qs);
    store.addLog({d:today, lesson:ctx.L.id, step:st.h, outcome:"right"});
    persist();
  } else {
    qs.tries++; qs.wrong.push(i);
    btn.classList.add("wrong"); btn.disabled = true;
    if(qs.tries === 1){
      fb.innerHTML = `<div class="fb hint"><div class="fb-t">힌트 (정답은 아직 공개하지 않음)</div>${st.hint||"지문의 조건을 다시 읽고 남은 선택지를 비교할 것."}</div>`;
      persist();
    } else {
      qs.resolved = true; qs.outcome = "revealed";
      document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      const okIdx = dispOkIdx(st);
      document.getElementById("opt"+okIdx).classList.add("right");
      fb.innerHTML = badFB(st, okIdx, false);
      document.getElementById("nextBtn").disabled = !stepCleared(st, qs);
      store.addLog({d:today, lesson:ctx.L.id, step:st.h, outcome:"revealed"});
      persist();
    }
  }
}
function prevStep(){ if(cur>0){ cur--; persist(); renderStep(); } }
function nextStep(){ cur++; persist(); renderStep(); }
function retryLesson(){
  quizState = {}; cur = 0;
  const saved = store.lesson(ctx.L.id);
  store.saveLesson(ctx.L.id, {step:0, done:saved.done, answers:{}});
  renderStep();
}
function doneHTML(){
  const answers = Object.values(quizState);
  const right = answers.filter(q=>q.outcome==="right").length;
  const total = answers.length;
  const nxt = partLessons(ctx.pk)[ctx.idx+1];

      ${nxt? `<button class="btn btn-primary" onclick="openUnit(ctx.pk, ctx.idx+1)">다음: ${unitLabel(nxt)} →</button>`:`<button class="btn btn-primary" onclick="go('home')">홈으로</button>`}
      <button class="btn btn-ghost" onclick="openPart(ctx.pk)">파트 목록</button>
      ${total? `<button class="btn btn-ghost" onclick="retryLesson()">다시 풀기</button>`:""}
    </div>
  </div>`;
}

/* ================= 미니테스트 ================= */
let T = null;
function testSize(L){ const s = new Set(L.questions.map(q=>q.ts+"|"+q.lvl)); return s.size; }
/* 출제 목표·난이도 칸마다 [본 문항 + 추가 문항]에서 1개씩 추첨 */
function buildTestSet(L){
  const byKey = {};
  L.questions.forEach(q=>{ (byKey[q.ts+"|"+q.lvl] = byKey[q.ts+"|"+q.lvl]||[]).push(q); });
  (window.CCAO_EXTRA||[]).forEach(q=>{ const k = q.ts+"|"+q.lvl; if(byKey[k]) byKey[k].push(q); });
  const seen = new Set(), set = [];
  L.questions.forEach(q=>{
    const k = q.ts+"|"+q.lvl;
    if(seen.has(k)) return; seen.add(k);
    const pool = byKey[k];
    set.push(pool[Math.floor(Math.random()*pool.length)]);
  });
  return shuffleArr(set);
}
function openTest(pk, idx){
  const L = partLessons(pk)[idx];
  attemptSalt = ((Math.random()*0x7ffffffe)|0) + 1;
  T = {pk, idx, L, qs: buildTestSet(L), i:-1, answers:[]};
  const prev = store.test(L.id);
  view.innerHTML = `
    <div class="stage" style="padding-top:56px">
      <div class="step" style="text-align:center">
        <div class="eyebrow">MINI TEST · 실전 모드</div>
        <h2 style="margin-top:10px">${L.title}</h2>

function startExam(avoidLast){
  lockKo(true);
  attemptSalt = ((Math.random()*0x7ffffffe)|0) + 1;
  const pools = buildExamPools();
  const prev = avoidLast ? store.lastExam() : null;
  const prevQ = new Set((prev && prev.qids) || []);
  const flat = [];
  Object.entries(EXAM_COUNTS).forEach(([d,n])=>{
    const pool = pools[d] || [];
    const unseen = shuffleArr(pool.filter(q=>!prevQ.has(qid(q))));
    const seen = shuffleArr(pool.filter(q=>prevQ.has(qid(q))));
    [...unseen, ...seen].slice(0,n).forEach(q=>flat.push({q, d}));
  });
  shuffleArr(flat);
  EX = {flat, i:-1, answers:new Array(flat.length).fill(null), sel:null,
        deadline: Date.now()+120*60*1000, timerId:null, timedOut:false, fresh:!!avoidLast,
        freshCount: prev ? flat.filter(it=>!prevQ.has(qid(it.q))).length : flat.length};

function importArea(bg){
  const area = bg.querySelector("#dataArea");
  area.innerHTML = `<textarea id="impText" placeholder="복사해 둔 기록 코드를 여기에 붙여넣을 것" aria-label="기록 코드 입력"></textarea>
    <div class="mrow" style="margin-top:10px"><button class="btn btn-primary" id="impGo">이 기록으로 덮어쓰기</button></div>`;
  area.querySelector("#impGo").onclick = ()=>{
    try{
      const payload = JSON.parse(area.querySelector("#impText").value);
      const d = payload.app==="ccao-academy" ? payload.data : payload;
      if(!d || typeof d !== "object" || (!d.lessons && !d.log && !d.tests)) throw new Error("형식 불일치");
      store.set(d);
      if(payload.theme){ try{ localStorage.setItem("ccao_theme", payload.theme); }catch(e){} document.documentElement.dataset.theme = payload.theme; applyThemeIcon(); }
      bg.remove(); renderHome(); toast("기록이 복원됨");
    }catch(e){ toast("학습 기록 코드가 아님"); }
  };
}
function resetData(){
  askConfirm("기록 전체 초기화", "모든 진도와 문항 기록이 삭제되며 되돌릴 수 없음. 필요하면 먼저 기록 코드를 복사해 둘 것.", "초기화", ()=>{
    MEM = {}; try{ localStorage.removeItem(KEY); }catch(e){}
    renderHome(); toast("기록이 초기화됨");
  }, true);
}

/* ================= 부록 ================= */
function glossary(){ return (window.CCAO_GLOSS||[]).slice().sort((a,b)=>a.t.localeCompare(b.t,"ko")); }
function partTerms(pk){
  const meta = PARTS.find(p=>p.key===pk);
  const G = glossary();
  if(!meta || !meta.dom) return {own:[], base:[]};
  return { own: G.filter(g=>g.c===meta.dom), base: G.filter(g=>g.c==="공통") };
}
function openPartGloss(pk){
  const meta = PARTS.find(p=>p.key===pk);
  const {own, base} = partTerms(pk);
  const card = g => `<div class="gterm"><b>${g.t}</b><span class="gd">${g.d}</span></div>`;
  view.innerHTML = `
  <div class="ppage">
    <button class="crumb" onclick="openPart('${pk}')">← ${meta.ko}</button>
    <div class="phead">
      <div class="eyebrow">GLOSSARY · ${meta.dom}</div>
      <h1>${meta.ko} 용어 ${own.length}개</h1>
      <div class="pdesc">시험 지문은 이 용어들을 설명 없이 사용함. 뜻이 한 줄로 떠오르지 않으면 해당 레슨으로 돌아갈 것.</div>
    </div>
    <div class="prose">
      ${own.map(card).join("")}
      ${base.length? `<h4 style="margin-top:26px">전 영역 공통 용어 ${base.length}개</h4>${base.map(card).join("")}`:""}
      <div class="gcta" style="margin-top:24px">
        <button onclick="openPart('${pk}')">← 파트로 돌아가기</button>
        <button onclick="renderAppendix()">전체 용어 보기</button>
      </div>
    </div>
  </div>`;
  window.scrollTo(0,0);
}
const CAT_ORDER = ["공통","D1","D2","D3","D4","D5","D6","D7"];
function glossListHTML(f){
  const items = glossary().filter(g => !f || (g.t+g.d+g.c).toLowerCase().includes(f));
  const cats = CAT_ORDER.filter(c=>items.some(g=>g.c===c));
  return cats.map(c=>`<h4 style="margin-top:18px">${c==="공통"? "공통" : c+" "+DOMS[c].ko}</h4>
    ${items.filter(g=>g.c===c).map(g=>`<div class="gterm"><b>${g.t}</b><span class="gd">${g.d}</span></div>`).join("")}`).join("") || `<p class="muted">검색 결과 없음</p>`;
}
function renderAppendix(){
  setTab("appendix");
  const A = window.CCAO_APPENDIX || {cheat:"", principles:""};
  view.innerHTML = `
  <div class="ppage">
    <button class="crumb" onclick="go('home')">← 홈</button>
    <div class="phead">
      <div class="eyebrow">APPENDIX</div>
      <h1>부록: 판단 원칙 · 선택표 · 용어</h1>
      <div class="pdesc">시험 전날 복습용. 새 내용을 보지 말고 이 페이지와 오답 기록만 확인할 것.</div>
    </div>
    <div class="prose">
      <h2 style="font-size:19px;margin:6px 0 8px">판단 원칙 6</h2>
      ${A.principles}
      <h2 style="font-size:19px;margin:32px 0 8px">상황별 선택표</h2>
      ${A.cheat}
      <h2 style="font-size:19px;margin:32px 0 10px">용어 (${glossary().length})</h2>
      <label for="glosFilter" class="muted" style="font-size:12.5px">용어 검색</label>
      <input id="glosFilter" class="search" placeholder="예: Projects, 환각, 커넥터" oninput="document.getElementById('glosList').innerHTML = glossListHTML(this.value.toLowerCase())">
      <div id="glosList">${glossListHTML("")}</div>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

/* ================= 알림 · 시작 ================= */
let toastTimer;
function toast(msg){
  const old = document.querySelector(".toast"); if(old) old.remove();
  const t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), 2600);
}
try{ if(!/github\.io$/.test(location.hostname)){ const hl = document.getElementById("hubLink"); if(hl) hl.href = "https://claude.ai/artifact/JeM5j3myqU9g6QtmmPmpd7"; } }catch(e){}
document.querySelectorAll("footer a").forEach(a=>{ a.target = "_blank"; a.rel = "noopener"; });

applyKo();
